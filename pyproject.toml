[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triveni"
version = "0.1.0"
description = "Triveni: an engineering Company Brain on FalkorDB. Agents act, remember, and prove every answer with a path."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.8,<2",
    "python-dotenv>=1.0",
    "anthropic>=1.15,<2",
    "openai>=2.54,<3",  # Groq and Gemini through their OpenAI-compatible endpoints (the default providers)
    "redis>=8.1,<9",  # FalkorDB's transport; imported directly for connection/timeout errors (503 handler)
    "anyio>=4.15,<5",  # agent loop and MCP client
    "pydantic>=2.7",
    "mcp>=2.3,<3",
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # FastAPI TestClient
    "scikit-learn>=1.5",  # eval: TF-IDF flat baseline
    "networkx>=3.3",  # tests only: cross-checks algorithm ground truth
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
markers = [
    "db: needs a running FalkorDB (skipped when TRIVENI_FALKORDB_HOST is unreachable)",
]
